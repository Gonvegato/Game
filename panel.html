<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<!--PAGE-->
<title>Sala de Kiteo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Una sola pantalla: el lienzo ocupa todo; HUD, botones táctiles y paneles van encima. Aspecto único y oscuro. */
:root{
  --wall:#120e14; --panel:#1e1820; --line:#57463c;
  --ink:#efe6d0; --dim:#a89c8a;
  --ember:#ff8a3c; --energy:#f2c14e; --blood:#d8434f;
  --display:"Pixelify Sans",ui-monospace,"Courier New",monospace;
  --title:"Jacquard 12","Pixelify Sans",ui-monospace,monospace;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:relative;height:100%;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.layer{position:absolute;inset:0;pointer-events:none;box-sizing:border-box;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.layer button{pointer-events:auto;font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--energy);outline-offset:2px}

/* HUD */
#hud{display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.stack{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:58%}
.stack.end{align-items:flex-end;text-align:right}
.hp{position:relative;width:min(220px,46vw);height:14px;background:var(--panel);border:1px solid var(--line)}
#hpFill{position:absolute;inset:0 auto 0 0;width:100%;background:var(--blood)}
#hpTxt{position:absolute;inset:0;display:grid;place-items:center;font:600 11px/1 var(--display);font-variant-numeric:tabular-nums}
#wave{font:600 15px/1.2 var(--display);letter-spacing:.02em}
#res{font:600 12px/1.2 var(--display);color:var(--ink)}
#sys{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top,0px));transform:translateX(-36%);max-width:min(460px,38%);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-left-width:4px;padding:5px 10px;font:600 12px/1.3 var(--display);text-align:center;text-wrap:balance}
/* Avisos de ayuda: arriba, donde salen los mensajes de deidad (que esperan mientras tanto), pero más grandes. Ahí no hay HUD (va abajo a la izquierda), ni botones táctiles, ni tapan el centro de la sala */
#tip{position:absolute;left:45%;top:max(12px,env(safe-area-inset-top,0px));transform:translateX(-50%);box-sizing:border-box;width:max-content;max-width:min(540px,56%);background:rgba(18,14,20,.95);border:2px solid var(--energy);box-shadow:0 0 0 2px #0b080d,0 6px 18px rgba(0,0,0,.6);padding:8px 14px 10px;font:500 14px/1.38 var(--body);color:var(--ink);text-wrap:pretty;animation:tipin .25s ease-out}
#tip em,.tipbox em{display:block;font:600 10px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--energy);font-style:normal;margin-bottom:4px}
#tip b,.tipbox b{color:var(--energy)}
@keyframes tipin{from{opacity:0;transform:translate(-50%,-8px)}}
.tipbox{border:2px solid var(--energy);background:rgba(242,193,78,.08);padding:9px 14px 10px;font-size:14px;line-height:1.4}
@media (max-height:420px){#tip{font-size:13px;padding:6px 12px 8px}.tipbox{font-size:13px;padding:6px 12px 7px}}
.newgod{margin-top:2px}.newgod em{font:600 11px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-style:normal}.newgod h2{font-size:24px}
#boss{position:absolute;left:50%;bottom:max(34px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(420px,60%);display:flex;flex-direction:column;gap:3px;align-items:center;font:600 13px/1 var(--display)}
.bbar{position:relative;width:100%;height:10px;background:var(--panel);border:1px solid var(--line)}
#bossFill{position:absolute;inset:0 auto 0 0;width:100%;background:var(--blood)}
#stats,#dev,#hint{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
#hint{text-align:center;text-wrap:balance}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--panel);border:1px solid var(--line);padding:5px 9px;font-size:12px;border-radius:2px}

/* HUD nuevo: barra de vida con marco, cabecera del encargo con cuentas, recursos en fichas y las cuatro acciones en casillas */
.hp{height:18px;width:min(250px,46vw);margin-left:26px;background:#0b080d;border:2px solid #0b080d;box-shadow:0 0 0 2px var(--line),0 3px 0 2px rgba(0,0,0,.35)}
.hp::before{content:"";position:absolute;left:-30px;top:-3px;width:22px;height:20px;background:var(--blood);clip-path:polygon(18% 0,41% 0,41% 10%,59% 10%,59% 0,82% 0,82% 10%,100% 10%,100% 50%,91% 50%,91% 60%,82% 60%,82% 70%,73% 70%,73% 80%,64% 80%,64% 90%,55% 90%,55% 100%,45% 100%,45% 90%,36% 90%,36% 80%,27% 80%,27% 70%,18% 70%,18% 60%,9% 60%,9% 50%,0 50%,0 10%,18% 10%);filter:drop-shadow(0 2px 0 #0b080d)}
#hpFill{background:linear-gradient(#f2707a 0 30%,var(--blood) 30% 78%,#8d2733 78%);transition:width .15s}
#hpFill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 23px,rgba(11,8,13,.45) 23px 25px)}
#hpTxt{font-size:12px;text-shadow:0 1px 0 #0b080d,1px 0 0 #0b080d,-1px 0 0 #0b080d,0 -1px 0 #0b080d;z-index:1}
#wave{display:flex;flex-direction:column;gap:1px;margin-top:5px;text-shadow:0 1px 0 #0b080d,0 2px 4px rgba(0,0,0,.7)}
#wave b{font:600 16px/1.15 var(--display);color:var(--energy)}
#wave span{font:600 11px/1.2 var(--display);color:var(--ink);letter-spacing:.03em}
#pips{display:flex;align-items:center;gap:3px;flex-wrap:wrap;max-width:min(320px,52vw)}
#pips i{width:8px;height:8px;box-sizing:border-box;background:#1b151c;border:1px solid var(--line)}
#pips i.done{background:var(--energy);border-color:#0b080d}
#pips i.now{background:var(--ember);border-color:#fff3d6;animation:pip 1s steps(2) infinite}
#pips i.boss{width:11px;height:11px;border-color:var(--blood);transform:rotate(45deg);margin:0 3px}
#pips i.shop{width:5px;height:5px;border-radius:50%;background:#3d6ea8;border:0}
@keyframes pip{50%{background:#ffd9a8}}
#stats{font:600 11px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 0 #0b080d}
#res{display:flex;gap:5px;flex-wrap:wrap}
.rc{display:inline-flex;align-items:center;gap:5px;background:rgba(18,14,20,.82);border:1px solid var(--line);padding:2px 8px 2px 5px;font:600 12px/1.3 var(--display);font-variant-numeric:tabular-nums}
.rc i{width:9px;height:9px;box-sizing:border-box;border:1px solid #0b080d}
.rc.gold i{background:#ffd24a;border-radius:50%}.rc.gold{color:#ffd24a}
.rc.soul i{background:#b9c6ff;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}.rc.soul{color:#b9c6ff}
.rc.iron i{background:#c9d2e0;transform:skewX(-14deg)}.rc.iron{color:#c9d2e0}
.rc.fury i{background:#d9a066;clip-path:polygon(50% 0,100% 100%,0 100%)}.rc.fury{color:#d9a066}
.rc.shade i{background:#8b7fd6;border-radius:50% 50% 2px 2px}.rc.shade{color:#b3a9ee}
#build{flex-direction:row;flex-wrap:wrap;gap:4px;max-width:min(470px,58vw)}
#build li.slot{flex-direction:column;align-items:flex-start;gap:1px;box-sizing:border-box;width:108px;background:rgba(18,14,20,.84);border:1px solid var(--line);border-top:3px solid var(--c,var(--line));padding:3px 7px 4px}
#build li.slot em{min-width:0;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
#build li.slot b{font:600 12px/1.15 var(--display);color:var(--c,var(--dim));max-width:100%}
#build li.slot u{display:flex;gap:2px;text-decoration:none;height:4px}#build li.slot u i{width:6px;height:4px;background:var(--c)}
#build li.slot.empty{opacity:.5;border-top-color:var(--line)}
.chip{background:rgba(18,14,20,.84);border:1px solid var(--line);box-shadow:0 2px 0 #0b080d;font:600 12px/1 var(--display);padding:6px 10px}
#sys{box-shadow:0 3px 0 rgba(0,0,0,.4)}
#boss span{color:var(--blood);text-shadow:0 1px 0 #0b080d;letter-spacing:.06em;text-transform:uppercase}
.bbar{height:12px;border:2px solid #0b080d;box-shadow:0 0 0 2px var(--line)}#bossFill{background:linear-gradient(#f2707a 0 30%,var(--blood) 30%)}
@media (max-height:440px){#build li.slot{width:96px;padding:2px 6px 3px}#build li.slot b{font-size:11px}#wave b{font-size:14px}#stats{display:none}}

/* Paneles con más cuerpo: marco doble, cabecera con filete, botones en relieve y cartas con banda de color */
#ovBody{background:linear-gradient(#251d28,#1a151c 55%);border-color:#7a6248;box-shadow:inset 0 0 0 2px #2a2128,inset 0 0 0 3px #46372e,0 20px 60px rgba(0,0,0,.65)}
#ovBody h1{padding-bottom:10px;background:linear-gradient(90deg,var(--ember),transparent 70%) left bottom/100% 2px no-repeat;text-shadow:0 3px 0 #0b080d}
.primary,.fi.primary{box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.25),0 3px 0 #0b080d;letter-spacing:.03em}
.fi{background:linear-gradient(#17121a,#120e14);box-shadow:0 2px 0 #0b080d;transition:transform .08s,border-color .08s}
.fi.sel{border-color:var(--energy);box-shadow:0 0 0 1px var(--energy),0 0 14px rgba(242,193,78,.35),0 2px 0 #0b080d;transform:translateY(-1px)}
.fi.on:not(.tab){background:linear-gradient(#241a18,#17121a)}
.fi.off{opacity:.62}
.card{position:relative;border-top:5px solid var(--fam);background:linear-gradient(color-mix(in srgb,var(--fam) 13%,#120e14),#120e14 46%);box-shadow:0 3px 0 #0b080d;padding-top:12px;transition:transform .1s}
.card.sel{border-color:var(--energy);border-top-color:var(--fam);box-shadow:0 0 0 2px var(--energy),0 0 22px rgba(242,193,78,.4);transform:translateY(-4px)}
.card strong{font-size:17px;color:var(--ink)}
.card span{color:#cfc4b2}

.titlebox{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
#ovBody h1.logo{font-size:clamp(46px,10vw,84px);background:none;padding:0;text-shadow:0 4px 0 #7a3b12,0 7px 0 #0b080d,0 0 34px rgba(255,138,60,.35)}
.primary.big{align-self:center;font-size:20px;padding:14px 44px}
.ctl{align-self:stretch;text-align:left;border:1px solid var(--line);padding:6px 12px;background:rgba(11,8,13,.4)}.ctl summary{cursor:pointer;font:600 13px/1.6 var(--display);color:var(--energy)}.ctl .keys{margin-top:6px}
#app:has(.titlebox) #hud{visibility:hidden}

/* El HUD del jugador va abajo a la izquierda y algo más pequeño */
#hud .row>.stack:first-child{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));flex-direction:column-reverse;gap:5px;transform:scale(.84);transform-origin:left bottom;max-width:70%}
#hud .row{justify-content:flex-end}
#wave{margin-top:0}

/* Botones táctiles */
#touch{display:flex;align-items:flex-end;justify-content:flex-end;padding-bottom:28px}
.pad{display:grid;grid-template-columns:auto auto;gap:12px;align-items:end;justify-items:end}
.tb{width:64px;height:64px;border-radius:50%;background:var(--panel);border:2px solid var(--line);font:600 11px/1.1 var(--display);opacity:.82;touch-action:none}
.tb.big{width:92px;height:92px;border-color:var(--energy);font-size:14px;grid-row:span 2}
.tb.down{background:var(--line);opacity:1}

/* Paneles */
#overlay{display:flex;overflow:auto;pointer-events:auto;background:color-mix(in srgb,var(--wall) 72%,transparent)}
#ovBody{margin:auto;width:min(620px,100%);display:flex;flex-direction:column;gap:14px;background:var(--panel);border:2px solid var(--line);outline:2px solid #0b080d;box-shadow:inset 0 0 0 2px #2a2128;padding:22px;box-sizing:border-box}
.eyebrow{margin:0;color:var(--ember);font:600 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase}
h1{margin:0;font:400 clamp(32px,6.5vw,46px)/1 var(--title);color:var(--energy);text-wrap:balance;font-variant-ligatures:none;letter-spacing:.01em}
.lead{margin:0;line-height:1.5;max-width:60ch}
.fine{margin:0;color:var(--dim);font-size:12px}
.keys{margin:0;display:flex;flex-direction:column;gap:8px}
.keys div{display:grid;grid-template-columns:72px 1fr;gap:10px}
.keys dt{font:600 13px/1.4 var(--display);color:var(--energy)}
.keys dd{margin:0;color:var(--dim);line-height:1.4;min-width:0}
.primary{align-self:flex-start;background:var(--ember);color:var(--wall);border:0;padding:11px 22px;font:600 16px/1 var(--display);border-radius:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--wall);border:2px solid var(--line);padding:14px 12px;border-radius:2px;min-width:0}
.card strong{font:600 15px/1.2 var(--display)}
.card span{color:var(--dim);font-size:13px;line-height:1.35}
.card em{font:600 11px/1 var(--display);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--fam)}
.card em i{font-style:normal}
.card small{color:var(--dim);font-size:11px;margin-top:auto}
.card small.gloss{margin-top:0;display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line);padding-top:6px;line-height:1.3}
small.gloss{display:flex;flex-direction:column;gap:2px;margin-top:5px;font-size:.86em;line-height:1.3;opacity:.88;border-top:1px dashed var(--line);padding-top:4px}.glossall li span{opacity:.9}
.gloss q{quotes:none}.gloss b{color:var(--ink);font-weight:600}
.fi span.leg{color:var(--energy)}
.fi span.aff{font-size:12px}
.legends li.own b{color:var(--energy)}.legends i{color:var(--dim)}
.build{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:12px}
.build li{display:flex;gap:6px;align-items:baseline;min-width:0}
.build em{font:600 11px/1.3 var(--display);font-style:normal;color:var(--dim);min-width:52px}
.build b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.build li.line{flex-wrap:wrap;gap:2px 12px;font-size:12px;max-width:min(560px,56vw)}.build li.line em{min-width:0;font-size:10px}.build li.line .more{color:var(--dim)}
.build.full li{flex-wrap:wrap}
.build.full b{white-space:normal}
.build span{color:var(--dim)}
.build.full{gap:8px;font-size:13px}
.build.full em{min-width:60px}
.build.full span{flex-basis:100%;line-height:1.35}
#ovBody.wide{width:min(1000px,100%)}
.book{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.book section{min-width:0;display:flex;flex-direction:column;gap:8px}
.book h2{margin:0;font:600 16px/1.2 var(--display)}
.book li:not(.own) b{color:var(--dim)}
.forge{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.forge section{display:flex;flex-direction:column;gap:8px;min-width:0}
.forge h3{margin:6px 0 0;font:600 13px/1.2 var(--display);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.fi.sub{margin-left:18px}
.keeper{display:flex;align-items:center;gap:26px;margin:26px 0 22px 18px;font-style:italic;opacity:.9}.keeper i{display:block;flex:none;background:url(assets/chars.png) no-repeat;image-rendering:pixelated;transform:scale(3);transform-origin:left center;margin-right:56px}
.forge.locked{opacity:.5;filter:saturate(.4)}
/* Menú principal */
.tmenu{display:flex;flex-direction:column;gap:8px;width:min(420px,100%);margin:6px auto 0}
.fi.tm{grid-template-columns:1fr auto;padding:12px 16px;text-align:left}.fi.tm b{font-size:17px}.fi.tm i{font-size:13px;color:var(--energy)}
.fi.tm.sel{background:linear-gradient(90deg,rgba(255,138,60,.28),#17121a 75%);border-color:var(--ember)}
.fi.tm.danger b{color:#ff8f97}
.titlebox h2{margin:0;font:600 20px/1.2 var(--display);color:var(--ember)}
.titlebox .ver{margin:0;font-size:13px;line-height:1.5;color:var(--dim)}.titlebox .ver b{color:var(--ink);font-size:15px}
.titlebox .vertag{opacity:.7;margin-top:4px}
/* ── Forja, tienda y recetario: filas con el icono en un marco, estado a la derecha ── */
.pic.t,.tile{grid-column:1;grid-row:1/span 9;align-self:start;margin:2px 0 0;flex:none;box-sizing:content-box;border:2px solid #5a4636;outline:2px solid #0b080d;background-color:#0e0a10;padding:4px;border-radius:2px;box-shadow:inset 0 0 0 1px #2a2128}
.pic.t.none{background-image:none}
.tile{display:grid;place-items:center;width:32px;height:32px;font-style:normal}.tile .ico{margin:0}
.fi.row,.fi.stall{grid-template-columns:44px 1fr auto;column-gap:14px;align-items:start;padding:10px 12px}
.fi.row>b,.fi.row>span,.fi.row>small,.fi.stall>b,.fi.stall>span,.fi.stall>small{grid-column:2}
.fi.row>span.pic.t,.fi.stall>em.tile{grid-column:1;grid-row:1/span 9}
.fi.row>i,.fi.stall>i{grid-column:3;grid-row:1/span 9;align-self:center;text-align:center}
.fi.row.on .pic.t,.fi.slot.on .pic.t{border-color:var(--ember)}
.fi i.st{border:1px solid currentColor;padding:6px 9px;border-radius:2px;line-height:1.35;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.fi i.st.ok{color:#8fd08a;background:rgba(80,160,80,.12)}.fi i.st.go{color:var(--ink)}.fi i.st.buy{color:var(--energy)}.fi.off i.st.buy{color:var(--dim)}
.gunwrap{display:grid;grid-template-columns:minmax(210px,250px) 1fr;gap:18px;align-items:start}
.gunwrap .slots{display:flex;flex-direction:column;gap:8px;position:sticky;top:0}
.gunwrap .gcol{display:flex;flex-direction:column;gap:10px;min-width:0}.gunwrap .gcol h3{margin:0;font:600 14px/1.2 var(--display);color:var(--ember);letter-spacing:.06em;text-transform:uppercase}
.gunwrap .plist{grid-template-columns:1fr}
.fi.slot.row{padding:8px 10px}.fi.slot.row b{font-size:11px}.fi.slot.row span{font:600 14px/1.2 var(--display);color:var(--ink)}.fi.slot.row i{color:var(--dim)}
.fi.slot.row.on{background:linear-gradient(90deg,rgba(255,138,60,.2),#17121a 70%)}
@media (max-width:760px){.gunwrap{grid-template-columns:1fr}.gunwrap .slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));position:static}}
.purse{margin:0;font-size:14px;color:var(--dim)}.purse span{margin:0 8px}.purse b{font:600 18px/1 var(--display);color:var(--ink)}.purse b.life{color:#ff8f97}
.coin{color:var(--energy)!important;text-decoration:none}.coin::before{content:"";display:inline-block;width:9px;height:9px;margin-right:6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3bf,#f2c14e 55%,#a8742a);box-shadow:0 0 0 1px #0b080d;vertical-align:baseline}
.shopwrap{display:grid;grid-template-columns:1fr minmax(240px,300px);gap:20px;align-items:start}
.shopwrap>div{display:flex;flex-direction:column;gap:12px;min-width:0}
.stalls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.fi.stall>i{font-size:15px}.fi.stall.sold{opacity:.55}.fi.stall.sold>i{color:var(--dim);border:1px solid var(--dim);padding:5px 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;transform:rotate(-6deg)}
.carry{border:2px solid var(--line);background:#120e14;padding:12px 14px;display:flex;flex-direction:column;gap:8px}.carry h2{margin:0;font:600 14px/1.2 var(--display);color:var(--ember);letter-spacing:.06em;text-transform:uppercase}
@media (max-width:820px){.shopwrap{grid-template-columns:1fr}}
.bktabs{display:flex;flex-wrap:wrap;gap:5px}
.bkt{font:600 11px/1 var(--display);letter-spacing:.04em;padding:7px 9px;background:#120e14;color:var(--dim);border:1px solid var(--line);border-bottom:3px solid var(--c);border-radius:2px;cursor:pointer}
.bkt.on{background:var(--c);color:#120e14;border-color:var(--c)}
.bkpage{display:flex;flex-direction:column;gap:12px}
