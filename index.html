<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<!--PAGE-->
<title>Sala de Kiteo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Una sola pantalla: el lienzo ocupa todo; HUD, botones táctiles y paneles van encima. Aspecto único y oscuro. */
:root{
  --wall:#0e1017; --panel:#161a24; --line:#3a4258;
  --ink:#ece8dd; --dim:#a3a9bd;
  --ember:#ff9a3c; --energy:#62e6ff; --blood:#e5506a;
  --display:"Pixelify Sans",ui-monospace,"Courier New",monospace;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:relative;height:100%;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.layer{position:absolute;inset:0;pointer-events:none;box-sizing:border-box;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.layer button{pointer-events:auto;font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--energy);outline-offset:2px}

/* HUD */
#hud{display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.stack{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:58%}
.stack.end{align-items:flex-end;text-align:right}
.hp{position:relative;width:min(220px,46vw);height:14px;background:var(--panel);border:1px solid var(--line)}
#hpFill{position:absolute;inset:0 auto 0 0;width:100%;background:var(--blood)}
#hpTxt{position:absolute;inset:0;display:grid;place-items:center;font:600 11px/1 var(--display);font-variant-numeric:tabular-nums}
#wave{font:600 15px/1.2 var(--display);letter-spacing:.02em}
#res{font:600 12px/1.2 var(--display);color:var(--ink)}
#sys{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(560px,70%);background:var(--panel);border:1px solid var(--line);border-left-width:4px;padding:8px 12px;font:600 13px/1.35 var(--display);text-align:center;text-wrap:balance}
#boss{position:absolute;left:50%;bottom:max(34px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(420px,60%);display:flex;flex-direction:column;gap:3px;align-items:center;font:600 13px/1 var(--display)}
.bbar{position:relative;width:100%;height:10px;background:var(--panel);border:1px solid var(--line)}
#bossFill{position:absolute;inset:0 auto 0 0;width:100%;background:var(--blood)}
#stats,#dev,#hint{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
#hint{text-align:center;text-wrap:balance}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--panel);border:1px solid var(--line);padding:5px 9px;font-size:12px;border-radius:2px}

/* Botones táctiles */
#touch{display:flex;align-items:flex-end;justify-content:flex-end;padding-bottom:28px}
.pad{display:grid;grid-template-columns:auto auto;gap:12px;align-items:end;justify-items:end}
.tb{width:64px;height:64px;border-radius:50%;background:var(--panel);border:2px solid var(--line);font:600 11px/1.1 var(--display);opacity:.82;touch-action:none}
.tb.big{width:92px;height:92px;border-color:var(--energy);font-size:14px;grid-row:span 2}
.tb.down{background:var(--line);opacity:1}

/* Paneles */
#overlay{display:flex;overflow:auto;pointer-events:auto;background:color-mix(in srgb,var(--wall) 72%,transparent)}
#ovBody{margin:auto;width:min(620px,100%);display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);padding:22px;box-sizing:border-box}
.eyebrow{margin:0;color:var(--ember);font:600 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase}
h1{margin:0;font:600 clamp(24px,5vw,34px)/1.1 var(--display);text-wrap:balance;font-variant-ligatures:none}
.lead{margin:0;line-height:1.5;max-width:60ch}
.fine{margin:0;color:var(--dim);font-size:12px}
.keys{margin:0;display:flex;flex-direction:column;gap:8px}
.keys div{display:grid;grid-template-columns:72px 1fr;gap:10px}
.keys dt{font:600 13px/1.4 var(--display);color:var(--energy)}
.keys dd{margin:0;color:var(--dim);line-height:1.4;min-width:0}
.primary{align-self:flex-start;background:var(--ember);color:var(--wall);border:0;padding:11px 22px;font:600 16px/1 var(--display);border-radius:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--wall);border:2px solid var(--line);padding:14px 12px;border-radius:2px;min-width:0}
.card strong{font:600 15px/1.2 var(--display)}
.card span{color:var(--dim);font-size:13px;line-height:1.35}
.card em{font:600 11px/1 var(--display);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--fam)}
.card em i{font-style:normal}
.card small{color:var(--dim);font-size:11px;margin-top:auto}
.build{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:12px}
.build li{display:flex;gap:6px;align-items:baseline;min-width:0}
.build em{font:600 11px/1.3 var(--display);font-style:normal;color:var(--dim);min-width:52px}
.build b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.build.full li{flex-wrap:wrap}
.build.full b{white-space:normal}
.build span{color:var(--dim)}
.build.full{gap:8px;font-size:13px}
.build.full em{min-width:60px}
.build.full span{flex-basis:100%;line-height:1.35}
#ovBody.wide{width:min(1000px,100%)}
.book{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.book section{min-width:0;display:flex;flex-direction:column;gap:8px}
.book h2{margin:0;font:600 16px/1.2 var(--display)}
.book li:not(.own) b{color:var(--dim)}
.forge{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.forge section{display:flex;flex-direction:column;gap:8px;min-width:0}
.forge h3{margin:6px 0 0;font:600 13px/1.2 var(--display);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.fi.sub{margin-left:18px}
.forge h2{margin:0;font:600 16px/1.2 var(--display);color:var(--ember)}
.fi{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;background:var(--wall);border:2px solid var(--line);padding:10px 12px;border-radius:2px;color:var(--ink);font:inherit;cursor:pointer}
.fi b{font:600 15px/1.2 var(--display)}
.fi span{grid-column:1;color:var(--dim);font-size:12px}
.fi i{grid-column:2;grid-row:1/3;align-self:center;font-style:normal;font:600 12px/1 var(--display);color:var(--energy);white-space:nowrap}
.fi.off i{color:var(--dim)}
.fi.on{border-color:var(--ember)}
.fi.sel{border-color:var(--energy)}
.fi.primary{display:block;align-self:flex-start;border:2px solid var(--ember);background:var(--ember);color:var(--wall);padding:11px 22px;font:600 16px/1 var(--display)}
.fi.primary.sel{border-color:var(--ink)}
.btns{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ghost{background:none;border:1px solid var(--line);padding:9px 16px;font:600 14px/1 var(--display);border-radius:2px}
.card.sel{border-color:var(--energy)}
@media (max-width:520px){.cards{grid-template-columns:1fr}#hint{display:none}}
@media (max-height:420px){#ovBody{padding:14px;gap:9px}.keys{gap:4px}#hint{display:none}}
</style>
<!--/PAGE-->
</head>
<body>
<!--PAGE-->
<div id="app">
  <canvas id="game" aria-label="Sala de combate"></canvas>
  <div id="hud" class="layer">
    <div class="row">
      <div class="stack">
        <div class="hp"><div id="hpFill"></div><div id="hpTxt"></div></div>
        <div id="wave"></div>
        <div id="stats"></div>
        <div id="res"></div>
        <ul id="build" class="build"></ul>
      </div>
      <div class="stack end">
        <div class="chips">
          <button id="btnMute" class="chip">Sonido: sí</button>
          <button id="btnPause" class="chip">Pausa</button>
        </div>
        <div id="dev"></div>
      </div>
    </div>
    <div id="sys" hidden></div>
    <div id="boss" hidden><span>El Guardián</span><div class="bbar"><div id="bossFill"></div></div></div>
    <div id="hint"></div>
  </div>
  <div id="touch" class="layer" hidden>
    <div class="pad">
      <button id="btnChg" class="tb">Cargar</button>
      <button id="btnAtk" class="tb big">Disparar</button>
      <button id="btnDodge" class="tb">Esquivar</button>
    </div>
  </div>
  <div id="overlay" class="layer"><div id="ovBody"></div></div>
</div>
<script src="game.js"></script>
<!--/PAGE-->
</body>
</html>
