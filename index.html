<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<!--PAGE-->
<title>Sala de Kiteo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Una sola pantalla: el lienzo ocupa todo; HUD, botones táctiles y paneles van encima. Aspecto único y oscuro. */
:root{
  --wall:#120e14; --panel:#1e1820; --line:#57463c;
  --ink:#efe6d0; --dim:#a89c8a;
  --ember:#ff8a3c; --energy:#f2c14e; --blood:#d8434f;
  --display:"Pixelify Sans",ui-monospace,"Courier New",monospace;
  --title:"Jacquard 12","Pixelify Sans",ui-monospace,monospace;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:relative;height:100%;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.layer{position:absolute;inset:0;pointer-events:none;box-sizing:border-box;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.layer button{pointer-events:auto;font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--energy);outline-offset:2px}

/* HUD */
#hud{display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.stack{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:58%}
.stack.end{align-items:flex-end;text-align:right}
.hp{position:relative;width:min(220px,46vw);height:14px;background:var(--panel);border:1px solid var(--line)}
#hpFill{position:absolute;inset:0 auto 0 0;width:100%;background:var(--blood)}
#hpTxt{position:absolute;inset:0;display:grid;place-items:center;font:600 11px/1 var(--display);font-variant-numeric:tabular-nums}
#wave{font:600 15px/1.2 var(--display);letter-spacing:.02em}
#res{font:600 12px/1.2 var(--display);color:var(--ink)}
#sys{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top,0px));transform:translateX(-36%);max-width:min(460px,38%);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-left-width:4px;padding:5px 10px;font:600 12px/1.3 var(--display);text-align:center;text-wrap:balance}
#boss{position:absolute;left:50%;bottom:max(34px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(420px,60%);display:flex;flex-direction:column;gap:3px;align-items:center;font:600 13px/1 var(--display)}
.bbar{position:relative;width:100%;height:10px;background:var(--panel);border:1px solid var(--line)}
#bossFill{position:absolute;inset:0 auto 0 0;width:100%;background:var(--blood)}
#stats,#dev,#hint{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
#hint{text-align:center;text-wrap:balance}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--panel);border:1px solid var(--line);padding:5px 9px;font-size:12px;border-radius:2px}

/* Botones táctiles */
#touch{display:flex;align-items:flex-end;justify-content:flex-end;padding-bottom:28px}
.pad{display:grid;grid-template-columns:auto auto;gap:12px;align-items:end;justify-items:end}
.tb{width:64px;height:64px;border-radius:50%;background:var(--panel);border:2px solid var(--line);font:600 11px/1.1 var(--display);opacity:.82;touch-action:none}
.tb.big{width:92px;height:92px;border-color:var(--energy);font-size:14px;grid-row:span 2}
.tb.down{background:var(--line);opacity:1}

/* Paneles */
#overlay{display:flex;overflow:auto;pointer-events:auto;background:color-mix(in srgb,var(--wall) 72%,transparent)}
#ovBody{margin:auto;width:min(620px,100%);display:flex;flex-direction:column;gap:14px;background:var(--panel);border:2px solid var(--line);outline:2px solid #0b080d;box-shadow:inset 0 0 0 2px #2a2128;padding:22px;box-sizing:border-box}
.eyebrow{margin:0;color:var(--ember);font:600 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase}
h1{margin:0;font:400 clamp(32px,6.5vw,46px)/1 var(--title);color:var(--energy);text-wrap:balance;font-variant-ligatures:none;letter-spacing:.01em}
.lead{margin:0;line-height:1.5;max-width:60ch}
.fine{margin:0;color:var(--dim);font-size:12px}
.keys{margin:0;display:flex;flex-direction:column;gap:8px}
.keys div{display:grid;grid-template-columns:72px 1fr;gap:10px}
.keys dt{font:600 13px/1.4 var(--display);color:var(--energy)}
.keys dd{margin:0;color:var(--dim);line-height:1.4;min-width:0}
.primary{align-self:flex-start;background:var(--ember);color:var(--wall);border:0;padding:11px 22px;font:600 16px/1 var(--display);border-radius:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--wall);border:2px solid var(--line);padding:14px 12px;border-radius:2px;min-width:0}
.card strong{font:600 15px/1.2 var(--display)}
.card span{color:var(--dim);font-size:13px;line-height:1.35}
.card em{font:600 11px/1 var(--display);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--fam)}
.card em i{font-style:normal}
.card small{color:var(--dim);font-size:11px;margin-top:auto}
.card small.gloss{margin-top:0;display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line);padding-top:6px;line-height:1.3}
small.gloss{display:flex;flex-direction:column;gap:2px;margin-top:5px;font-size:.86em;line-height:1.3;opacity:.88;border-top:1px dashed var(--line);padding-top:4px}.glossall li span{opacity:.9}
.gloss q{quotes:none}.gloss b{color:var(--ink);font-weight:600}
.fi span.leg{color:var(--energy)}
.fi span.aff{font-size:12px}
.legends li.own b{color:var(--energy)}.legends i{color:var(--dim)}
.build{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:12px}
.build li{display:flex;gap:6px;align-items:baseline;min-width:0}
.build em{font:600 11px/1.3 var(--display);font-style:normal;color:var(--dim);min-width:52px}
.build b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.build li.line{flex-wrap:wrap;gap:2px 12px;font-size:12px;max-width:min(560px,56vw)}.build li.line em{min-width:0;font-size:10px}.build li.line .more{color:var(--dim)}
.build.full li{flex-wrap:wrap}
.build.full b{white-space:normal}
.build span{color:var(--dim)}
.build.full{gap:8px;font-size:13px}
.build.full em{min-width:60px}
.build.full span{flex-basis:100%;line-height:1.35}
#ovBody.wide{width:min(1000px,100%)}
.book{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.book section{min-width:0;display:flex;flex-direction:column;gap:8px}
.book h2{margin:0;font:600 16px/1.2 var(--display)}
.book li:not(.own) b{color:var(--dim)}
.forge{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.forge section{display:flex;flex-direction:column;gap:8px;min-width:0}
.forge h3{margin:6px 0 0;font:600 13px/1.2 var(--display);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.fi.sub{margin-left:18px}
.keeper{display:flex;align-items:center;gap:26px;margin:26px 0 22px 18px;font-style:italic;opacity:.9}.keeper i{display:block;flex:none;background:url(assets/chars.png) no-repeat;image-rendering:pixelated;transform:scale(3);transform-origin:left center;margin-right:56px}
.ico{display:inline-block;width:32px;height:32px;background:url(assets/items.png) no-repeat;image-rendering:pixelated;vertical-align:middle;margin:-6px 8px -4px 0}
.fhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.fhead .lead{font-size:13px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.fi.tab{display:block;padding:8px 16px;flex:1 1 110px;text-align:center}
.fi.tab.on{background:var(--ember);border-color:var(--ember)}.fi.tab.on b{color:var(--wall)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fi.slot{padding:8px 10px}.fi.slot b{font-size:13px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}.fi.slot span{color:var(--ink);font-size:13px}
.fi.slot.on{border-color:var(--ember)}
.plist{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px;align-items:start}
.gold{color:var(--energy);font-weight:600}
.keyhint{text-align:center}
.kingdom{display:flex;flex-direction:column;gap:10px}
.kingdom h2{margin:0;font:400 28px/1 var(--title);color:var(--energy)}
/* El tablón: mapa del reino con los encargos encima, y al lado el panel del encargo señalado y la leyenda */
#ovBody.wide:has(.kwrap){width:min(1220px,100%)}
.kwrap{display:grid;grid-template-columns:minmax(0,896px) minmax(210px,1fr);grid-template-rows:auto auto 1fr;grid-template-areas:"map head" "map info" "map legend";gap:10px 14px;align-items:start}
.kscroll{grid-area:map;overflow:auto;scroll-margin:12px;border:2px solid var(--line);outline:2px solid #0b080d;background:#0b080d;container-type:inline-size}
.kworld{position:relative;min-width:520px;--mk:32px;--mk:clamp(30px,3.9cqw,36px);--lf:11px;--lf:clamp(9.5px,1.42cqw,13px)}
.kworld canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.klab{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 7px 3px;background:color-mix(in srgb,var(--wall) 80%,transparent);border:1px solid #0b080d;border-bottom:3px solid var(--zc);pointer-events:none;white-space:nowrap;z-index:1}
.klab b{font:600 var(--lf)/1.05 var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}
.klab span{display:flex;align-items:center;gap:4px;font:600 calc(var(--lf)*.84)/1.05 var(--display);color:color-mix(in srgb,var(--zc) 62%,#fff)}
.klab.free span{color:var(--zc)}
.klab svg{width:.9em;height:.9em;fill:currentColor;shape-rendering:crispEdges}
.fi.mk{position:absolute;display:grid;grid-template-columns:none;place-items:center;gap:0;width:var(--mk);height:var(--mk);padding:0;margin-top:-6px;border-radius:50%;transform:translate(-50%,-100%);transform-origin:50% calc(100% + 6px);background:var(--wall);border:2px solid var(--ink);color:var(--energy);box-shadow:0 0 0 1px #0b080d,0 3px 0 #0b080d;z-index:2}
.fi.mk::after{content:"";position:absolute;left:50%;top:calc(100% + 1px);border:5px solid transparent;border-top:6px solid var(--ink);border-bottom:0;transform:translateX(-50%)}
.fi.mk svg{width:60%;height:60%;fill:currentColor;shape-rendering:crispEdges}
.fi.mk.k-boss{color:#ff8f97}.fi.mk.k-god{--mk:38px;--mk:clamp(32px,4.5cqw,42px);color:var(--ember)}
.fi.mk.on{border-color:#7fc97a;color:var(--dim)}.fi.mk.on::after{border-top-color:#7fc97a}
.fi.mk.off{background:#2a2128;border-color:#8a7a70;color:#8a7a70}.fi.mk.off::after{border-top-color:#8a7a70}
.fi.mk i.st{position:absolute;right:-7px;top:-7px;grid-area:auto;display:grid;place-items:center;width:52%;height:52%;border-radius:50%;background:#3a3038;border:1px solid #0b080d;color:var(--ink)}
.fi.mk i.st.ok{background:#3f8f4a;color:#fff}.fi.mk i.st svg{width:68%;height:68%}
.fi.mk.sel{border-color:var(--energy);box-shadow:0 0 0 1px #0b080d,0 0 0 4px var(--energy),0 0 0 5px #0b080d,0 3px 0 5px #0b080d;transform:translate(-50%,-100%) scale(1.16);z-index:4}
.fi.mk.sel::after{border-top-color:var(--energy);top:calc(100% + 4px)}
.khead{grid-area:head;display:flex;flex-direction:column;gap:5px;min-width:0}
.kinfo{grid-area:info;display:flex;flex-direction:column;gap:7px;min-width:0;padding:11px 12px 12px;background:var(--wall);border:2px solid var(--line)}
.kinfo .eyebrow{font-size:11px;line-height:1.2}
.kinfo h3{margin:0;font:600 18px/1.12 var(--display);color:var(--ink);text-wrap:balance}
.kinfo p{margin:0;font-size:13px;line-height:1.4}.kinfo p.dim{color:var(--dim)}
.kinfo p.need{color:var(--ink);border-left:3px solid var(--blood);padding-left:8px}
.kinfo dl{margin:0;display:flex;flex-direction:column;gap:3px}.kinfo dl div{display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:baseline}
.kinfo dt{font:600 11px/1.3 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.kinfo dd{margin:0;font:600 14px/1.3 var(--display);color:var(--energy);min-width:0}.kinfo dd small{display:block;font:400 11px/1.3 var(--body);color:var(--dim)}
.kinfo dd.ok{color:#7fc97a}.kinfo dd.no{color:var(--dim)}.kinfo dd.go{color:var(--ink)}
.kinfo .kgo{margin-top:3px;padding:9px 16px;font-size:15px;cursor:pointer}
.klegend{grid-area:legend;align-self:end;list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px 14px;font-size:12px;color:var(--dim)}
.klegend li{display:flex;align-items:center;gap:6px}
.klegend u{flex:none;width:14px;height:14px;background:color-mix(in srgb,var(--zc) 55%,#4a5a3a);border:2px solid var(--zc);box-sizing:border-box}
.klegend u.held{background:repeating-linear-gradient(135deg,var(--zc) 0 2px,color-mix(in srgb,var(--zc) 45%,#120e14) 2px 5px)}
.klegend li.ic{color:var(--energy)}.klegend li.k-boss{color:#ff8f97}.klegend li.k-god{color:var(--ember)}.klegend li.ic.ok{color:#7fc97a}.klegend li.ic:last-child{color:#a89c8a}
.klegend svg{width:13px;height:13px;fill:currentColor;shape-rendering:crispEdges}
@media (min-width:1000px) and (min-height:560px){.klegend{flex-direction:column;flex-wrap:nowrap;gap:5px}}
@media (max-width:999px),(max-height:559px){.kwrap{grid-template-columns:minmax(0,1fr) minmax(200px,236px);grid-template-rows:auto 1fr auto;grid-template-areas:"map head" "map info" "legend legend";gap:8px 12px}.kingdom h2{font-size:24px}.kinfo{padding:8px 10px 10px;gap:5px}.kinfo h3{font-size:16px}.kinfo p{font-size:12px;line-height:1.35}}
@media (max-width:640px){.kwrap{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"head" "map" "info" "legend"}}
.forge h2{margin:0;font:600 16px/1.2 var(--display);color:var(--ember)}
.fi{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;background:var(--wall);border:2px solid var(--line);padding:10px 12px;border-radius:2px;color:var(--ink);font:inherit;cursor:pointer}
.fi b{font:600 15px/1.2 var(--display)}
.fi b u{text-decoration:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ember);border:1px solid var(--ember);padding:1px 5px;margin-left:6px;white-space:nowrap}
.fi span{grid-column:1;color:var(--dim);font-size:12px}
.fi i{grid-column:2;grid-row:1/3;align-self:center;font-style:normal;font:600 12px/1 var(--display);color:var(--energy);white-space:nowrap}
.fi.off i{color:var(--dim)}
.fi.on{border-color:var(--ember)}
.fi.sel{border-color:var(--energy)}
.fi.primary{display:block;align-self:flex-start;border:2px solid var(--ember);background:var(--ember);color:var(--wall);padding:11px 22px;font:600 16px/1 var(--display)}
.fi.primary.sel{border-color:var(--ink)}
.btns{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ghost{background:none;border:1px solid var(--line);padding:9px 16px;font:600 14px/1 var(--display);border-radius:2px}
.card.sel{border-color:var(--energy)}
@media (max-width:520px){.cards{grid-template-columns:1fr}#hint{display:none}}
@media (max-height:420px){#ovBody{padding:14px;gap:9px}.keys{gap:4px}#hint{display:none}}
</style>
<!--/PAGE-->
</head>
<body>
<!--PAGE-->
<div id="app">
  <canvas id="game" aria-label="Sala de combate"></canvas>
  <div id="hud" class="layer">
    <div class="row">
      <div class="stack">
        <div class="hp"><div id="hpFill"></div><div id="hpTxt"></div></div>
        <div id="wave"></div>
        <div id="stats"></div>
        <div id="res"></div>
        <ul id="build" class="build"></ul>
      </div>
      <div class="stack end">
        <div class="chips">
          <button id="btnMute" class="chip">Sonido: sí</button>
          <button id="btnPause" class="chip">Pausa</button>
        </div>
        <div id="dev"></div>
      </div>
    </div>
    <div id="sys" hidden></div>
    <div id="boss" hidden><span>El Guardián</span><div class="bbar"><div id="bossFill"></div></div></div>
    <div id="hint"></div>
  </div>
  <div id="touch" class="layer" hidden>
    <div class="pad">
      <button id="btnChg" class="tb">Cargar</button>
      <button id="btnAtk" class="tb big">Disparar</button>
      <button id="btnDodge" class="tb">Esquivar</button>
    </div>
  </div>
  <div id="overlay" class="layer"><div id="ovBody"></div></div>
</div>
<script src="game.js"></script>
<!--/PAGE-->
</body>
</html>
